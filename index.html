<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>얼른해</title>

    <!-- Pretendard CDN -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <nav class="nav">
        <div class="logo">얼른해</div>
        <div class="nav-actions">
            <button class="text-btn">로그인</button>
            <button class="primary-btn">시작하기</button>
        </div>
    </nav>

    <main class="hero">
        <h1>
            체크리스트?<br>
            <span>얼른해.</span>
        </h1>

        <p class="sub">
            공유하고, 체크하고, 바로 확인.
        </p>

        <div class="hero-buttons">
            <button class="primary-btn large">얼른 시작</button>
            <button class="outline-btn large">서비스 소개</button>
        </div>
    </main>

    <section class="info">
        <div class="info-box">
            <h3>공동 진행</h3>
            <p>한 명이 체크하면 모두에게 적용.</p>
        </div>

        <div class="info-box">
            <h3>개별 진행</h3>
            <p>목표는 같고, 진행은 각자.</p>
        </div>

        <div class="info-box">
            <h3>달성 현황</h3>
            <p>완료한 날은 색으로 확인.</p>
        </div>
    </section>

</body>
</html>
